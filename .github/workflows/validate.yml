name: Validate Questions

on:
  push:
    paths:
      - 'data/questions/**'
      - 'js/**'
      - 'tests/**'
      - 'pages/**'
      - 'index.html'
      - 'css/**'
      - 'sw.js'
      - 'build/**'
      - 'changelog.json'
      - '.eslintrc.json'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/questions/**'
      - 'js/**'
      - 'tests/**'
      - 'pages/**'
      - 'index.html'
      - 'css/**'
      - 'sw.js'
      - 'build/**'
      - 'changelog.json'
      - '.eslintrc.json'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate question files
        run: node js/tools/validateQuestions.js
      - name: Run test suite
        run: node tests/run_tests.js
      - name: Lint JavaScript
        run: npx --yes eslint@8 js/src js/gamificacao.js js/game.js js/learning
