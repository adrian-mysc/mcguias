      font-size: 13px;

      font-family: var(--font-body);
      border: 2px solid var(--border);

      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn.active { background: var(--red); border-color: var(--red); color: white; }

      border-radius: var(--radius-lg);

      padding: 24px 18px;
      text-align: center;
      box-shadow: var(--shadow-md);

    .start-card p  { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
  </style>

  <script>
    // Splash — dismiss after fonts + content ready
    (function() {
      var t = localStorage.getItem('mc_theme') || (window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
      function hideSplash() {
        var s = document.getElementById('splash');
        if (!s) return;
        s.classList.add('hide');
        setTimeout(function() { s.style.display = 'none'; }, 420);
      }
      if (document.readyState === 'complete') {
        setTimeout(hideSplash, 200);
      } else {
        window.addEventListener('load', function() { setTimeout(hideSplash, 200); });
      }
    })();
  </script>

    ];

    // ── Mapeamento JSON categoria → quiz guide ──
    const GUIDE_MAP = {
      'chapa':                  'chapa',
      'lope':                   'lope',
      'lope2':                  'lope',
      'linha':                  'linha',
      'mcfritas':               'mcfritas',
      'fritas':                 'mcfritas',
      'fritos':                 'fritos',
      'condimentacao':          'condimentacao',
      'salao-ngk':              'salao',
      'montagem-entrega':       'montagem',
      'influencer-pagamento':   'influencer',
      'drive-thru':             'drive',
      'bebidas-sobremesas':     'bebidas',
      'embaixador-experiencia': 'embaixador',
      'seguranca-alimento':     'seguranca-alimento',
      'estoque-recebimento':    'estoque-recebimento',
      'fechamento':             'fechamento',
    };

    // ── Converter formato JSON → formato quiz ──
    function convertJSONQuestion(q) {
      var guide = GUIDE_MAP[q.categoria] || q.categoria;
      var cat   = q.subcategoria || q.categoria;
      var ans   = Array.isArray(q.alternativas) ? q.alternativas[q.respostaCorreta] : '';
      return {
        id:          q.id,
        guide:       guide,
        category:    cat,
        question:    q.pergunta,
        options:     q.alternativas || [],
        answer:      ans,
        explanation: q.explicacao || '',
        dificuldade: q.dificuldade || 2,
        tags:        q.tags || [],
      };
    }

    // ── Packs JSON a carregar ──
    const JSON_PACKS = [
      'chapa/basico', 'chapa/avancado',
      'lope/basico',
      'linha/basico', 'mcfritas/basico', 'fritas/basico',
      'fritos/basico', 'condimentacao/basico',
      'salao-ngk/basico', 'montagem-entrega/basico',
      'influencer-pagamento/basico', 'drive-thru/basico',
      'bebidas-sobremesas/basico', 'embaixador-experiencia/basico',
      'seguranca-alimento/basico', 'estoque-recebimento/basico',
      'fechamento/basico',
    ];

    let ALL_QUESTIONS = [...FALLBACK_QUESTIONS];
    let _questionsLoaded = false;

    async function loadJSONQuestions() {
      const base = '/mcguias/data/questions/';
      const results = await Promise.allSettled(
        JSON_PACKS.map(p => fetch(base + p + '.json').then(r => r.ok ? r.json() : null))
      );
      const fromJSON = [];
      results.forEach(r => {
        if (r.status === 'fulfilled' && r.value && r.value.questions) {
          r.value.questions.forEach(q => {
            if (q.ativo !== false) fromJSON.push(convertJSONQuestion(q));
          });
        }
      });
      ALL_QUESTIONS = [...fromJSON, ...FALLBACK_QUESTIONS];
      _questionsLoaded = true;
    }

    // ── Loading state ──
    const _loadPromise = loadJSONQuestions();

    async function ensureLoaded() {
      if (!_questionsLoaded) await _loadPromise;
    }

    let selectedGuide = "all";

    // Filter buttons
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => {
          b.classList.remove("active");
          b.setAttribute("aria-pressed", "false");
        });
        btn.classList.add("active");
        btn.setAttribute("aria-pressed", "true");
        selectedGuide = btn.dataset.guide;
      });
    });

    const GUIDE_NAMES = {
      all:"Simulado Geral", chapa:"Chapa", lope:"LOPE", linha:"Linha",
      mcfritas:"McFritas", fritos:"Fritos", condimentacao:"Condimentação",
      salao:"Salão e NGK", montagem:"Montagem e Entrega", mcdelivery:"McDelivery",
      influencer:"Influencer Vendedor", drive:"Drive-Thru",
      bebidas:"Bebidas e Sobremesas", mccafe:"McCafé",
      limpeza:"Limpeza e Sanitização", provas:"Provas Oficiais",
      temperaturas:"Tempos e Temperaturas", rendimentos:"Rendimentos",
      empilhamento:"Empilhamento Máximo"
    };

    async function startQuiz() {
      const btn = document.querySelector('[onclick="startQuiz()"]');
      if (btn) { btn.disabled = true; btn.classList.add('btn-loading'); btn.setAttribute('aria-busy', 'true'); }
      await ensureLoaded();
      if (btn) { btn.disabled = false; btn.classList.remove('btn-loading'); btn.removeAttribute('aria-busy'); }

      const pool = selectedGuide === "all"
        ? ALL_QUESTIONS
        : ALL_QUESTIONS.filter(q => q.guide === selectedGuide);

      if (!pool.length) return;

      const nome = GUIDE_NAMES[selectedGuide] || "Simulado";
      document.getElementById("quiz-setup").style.display = "none";
      const app = document.getElementById("quiz-app");
      app.style.display = "block";

      // Remove mode bar from previous run so it rebuilds cleanly
      const oldBar = document.getElementById("quiz-mode-bar");
      if (oldBar) oldBar.remove();

      initQuiz(pool, nome);
    }
  </script>
