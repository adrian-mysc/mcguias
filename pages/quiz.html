    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; }

      padding: 10px 16px;

      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-body);
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;

    .subcat-btn { font-size:11px !important; padding:6px 12px !important; min-height:36px !important; }
    .start-card {
      background: var(--card);
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--border);
      padding: 24px 18px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }
    .start-card h2 { font-size: 20px; margin: 12px 0 8px; }
    .start-card p  { font-size: 14px; color: var(--muted); margin-bottom: 20px; }

    // ── Mapeamento JSON categoria → quiz guide ──
    const GUIDE_MAP = {
      'chapa':                  'chapa',
      'lope':                   'lope',
      'lope2':                  'lope',
      'linha':                  'linha',
      'mcfritas':               'mcfritas',
      'fritas':                 'mcfritas',
      'fritos':                 'fritos',
      'condimentacao':          'condimentacao',
      'salao-ngk':              'salao',
      'montagem-entrega':       'montagem',
      'influencer-pagamento':   'influencer',
      'drive-thru':             'drive',
      'bebidas-sobremesas':     'bebidas',
      'embaixador-experiencia': 'embaixador',
      'seguranca-alimento':     'seguranca-alimento',
      'estoque-recebimento':    'estoque-recebimento',
      'fechamento':             'fechamento',
      'olimpiada':              'olimpiada',
      'mccafe':                 'mccafe',
      'best-burguer':           'best-burguer',
      'manutencao-preventivas': 'manutencao-preventivas',
    };

    // ── Converter formato JSON → formato quiz ──
    function convertJSONQuestion(q) {
      var guide = GUIDE_MAP[q.categoria] || q.categoria;
      var cat   = q.subcategoria || q.categoria;
      var ans   = Array.isArray(q.alternativas) ? q.alternativas[q.respostaCorreta] : '';
      return {
        id:          q.id,
        guide:       guide,
        category:    cat,
        question:    q.pergunta,
        options:     q.alternativas || [],
        answer:      ans,
        explanation: q.explicacao || '',
        dificuldade: q.dificuldade || 2,
        tags:        q.tags || [],
      };
    }

    // ── Packs JSON a carregar ──
    const JSON_PACKS = [
      'chapa/basico', 'chapa/avancado',
      'lope/basico',
      'linha/basico', 'mcfritas/basico', 'fritas/basico',
      'fritos/basico', 'condimentacao/basico',
      'salao-ngk/basico', 'montagem-entrega/basico',
      'influencer-pagamento/basico', 'drive-thru/basico',
      'bebidas-sobremesas/basico', 'embaixador-experiencia/basico',
      'seguranca-alimento/basico', 'estoque-recebimento/basico',
      'fechamento/basico',
      'olimpiada/basico',
      'mccafe/basico',
      'best-burguer/basico',
      'manutencao-preventivas/basico',
    ];

    let ALL_QUESTIONS = [...FALLBACK_QUESTIONS];
    let _questionsLoaded = false;

    async function loadJSONQuestions() {
      // Raiz da app: '/mcguias/' no GitHub Pages, '/' na Vercel/domínio próprio.
      const base = location.pathname.replace(/\/(pages\/)?[^\/]*$/, '/') + 'data/questions/';
      const results = await Promise.allSettled(
        JSON_PACKS.map(p => fetch(base + p + '.json').then(r => r.ok ? r.json() : null))
      );
      const fromJSON = [];
      results.forEach(r => {
        if (r.status === 'fulfilled' && r.value && r.value.questions) {
          r.value.questions.forEach(q => {
            if (q.ativo !== false) fromJSON.push(convertJSONQuestion(q));
          });
        }
      });
      ALL_QUESTIONS = [...fromJSON, ...FALLBACK_QUESTIONS];
      _questionsLoaded = true;
    }

    // ── Loading state ──
    const _loadPromise = loadJSONQuestions();

    async function ensureLoaded() {
      if (!_questionsLoaded) await _loadPromise;
    }

    let selectedGuide = "all";
    let selectedSubcat = "all";

    function updateSubcatRow() {
      var subRow = document.getElementById('subcat-row');
      if (!subRow) return;
      if (selectedGuide === 'all' || selectedGuide === 'sr') {
        subRow.style.display = 'none';
        selectedSubcat = 'all';
        return;
      }
      var guideQs = ALL_QUESTIONS.filter(function(q) { return q.guide === selectedGuide; });
      var catSet = {}, cats = [];
      guideQs.forEach(function(q) { if (q.category && !catSet[q.category]) { catSet[q.category] = true; cats.push(q.category); } });
      if (cats.length <= 1) { subRow.style.display = 'none'; return; }
      selectedSubcat = 'all';
      subRow.style.display = 'flex';
      subRow.innerHTML = '<button class="filter-btn subcat-btn active" data-subcat="all" aria-pressed="true">📋 Todas</button>'
        + cats.map(function(c) {
          return '<button class="filter-btn subcat-btn" data-subcat="' + c.replace(/"/g,'&quot;') + '" aria-pressed="false">' + c + '</button>';
        }).join('');
      subRow.querySelectorAll('.subcat-btn').forEach(function(b) {
        b.addEventListener('click', function() {
          subRow.querySelectorAll('.subcat-btn').forEach(function(x) { x.classList.remove('active'); x.setAttribute('aria-pressed','false'); });
          b.classList.add('active'); b.setAttribute('aria-pressed','true');
          selectedSubcat = b.dataset.subcat;
        });
      });
    }

    // Guide filter buttons
    document.querySelectorAll(".filter-btn:not(.subcat-btn)").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn:not(.subcat-btn)").forEach(b => {
          b.classList.remove("active");
          b.setAttribute("aria-pressed", "false");
        });
        btn.classList.add("active");
        btn.setAttribute("aria-pressed", "true");
        selectedGuide = btn.dataset.guide;
        selectedSubcat = 'all';
        _loadPromise.then(updateSubcatRow);
      });
    });

    const GUIDE_NAMES = {
      sr:"Revisão Espaçada",
      all:"Simulado Geral", chapa:"Chapa", lope:"LOPE", linha:"Linha",
      mcfritas:"McFritas", fritos:"Fritos", condimentacao:"Condimentação",
      salao:"Salão e NGK", montagem:"Montagem e Entrega", mcdelivery:"McDelivery",
      influencer:"Influencer Vendedor", drive:"Drive-Thru",
      bebidas:"Bebidas e Sobremesas", mccafe:"McCafé",
      limpeza:"Limpeza e Sanitização", provas:"Provas Oficiais",
      temperaturas:"Tempos e Temperaturas", rendimentos:"Rendimentos",
      // Nome com hífen: gamificacao.js casa conquistas BB por 'best-burguer'
      empilhamento:"Empilhamento Máximo", "best-burguer":"Best-Burguer"
    };

    async function startQuiz() {
      const btn = document.querySelector('[onclick="startQuiz()"]');
      if (btn) { btn.disabled = true; btn.classList.add('btn-loading'); btn.setAttribute('aria-busy', 'true'); }
      await ensureLoaded();
      if (btn) { btn.disabled = false; btn.classList.remove('btn-loading'); btn.removeAttribute('aria-busy'); }

      let pool;
      if (selectedGuide === 'sr') {
        try {
          const sr2 = JSON.parse(localStorage.getItem('mc_sr_v2') || '{}');
          const hashData = sr2.hashData || {};
          const now = Date.now();
          pool = ALL_QUESTIONS.filter(q => {
            const h = typeof getQuestionHash === 'function' ? getQuestionHash(q) : 0;
            const d = hashData[h];
            return d && d.nextReview && d.nextReview <= now;
          });
        } catch(e) { pool = []; }
        if (!pool.length) {
          if (btn) { btn.disabled = false; btn.classList.remove('btn-loading'); btn.removeAttribute('aria-busy'); }
          document.getElementById("quiz-setup").style.display = "none";
          const app = document.getElementById("quiz-app");
          app.style.display = "block";
          app.innerHTML = '<div style="text-align:center;padding:40px 16px;">' +
            '<div style="font-size:56px;margin-bottom:12px;">🎉</div>' +
            '<h3 style="font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--text);margin-bottom:8px;">Tudo em dia!</h3>' +
            '<p style="font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:20px;">Nenhuma questão de revisão espaçada está pendente.<br>Continue praticando para criar mais cartões de SR.</p>' +
            '<button class="btn-secondary" onclick="document.getElementById(\'quiz-setup\').style.display=\'\';document.getElementById(\'quiz-app\').style.display=\'none\';">← Voltar</button>' +
            '</div>';
          return;
        }
      } else {
        pool = selectedGuide === "all"
          ? ALL_QUESTIONS
          : ALL_QUESTIONS.filter(q => q.guide === selectedGuide);
        if (selectedSubcat && selectedSubcat !== 'all') {
          pool = pool.filter(q => q.category === selectedSubcat);
        }
      }

      if (!pool.length) return;

      const nome = GUIDE_NAMES[selectedGuide] || "Simulado";
      document.getElementById("quiz-setup").style.display = "none";
      const app = document.getElementById("quiz-app");
      app.style.display = "block";

      // Remove mode bar from previous run so it rebuilds cleanly
      const oldBar = document.getElementById("quiz-mode-bar");
      if (oldBar) oldBar.remove();

      initQuiz(pool, nome);
    }
