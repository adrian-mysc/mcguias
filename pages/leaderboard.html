<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.style.visibility="hidden"</script>
  <script type="module" src="../js/auth-guard.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking — MC Guias</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .lb-page {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 14px 90px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Stat cards (mesmo padrão do dashboard) ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .stat-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-card-num {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 900;
      color: var(--red);
      line-height: 1;
    }
    .stat-card-num.yellow { color: #f59e0b; }
    .stat-card-num.green  { color: #22c55e; }
    .stat-card-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      margin-top: 2px;
    }

    /* ── Lista do ranking ── */
    .lb-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      transition: box-shadow .15s;
    }
    .lb-row.lb-me {
      border-color: #f59e0b;
      background: linear-gradient(135deg, rgba(245,158,11,0.06) 0%, transparent 100%);
      box-shadow: 0 0 0 2px rgba(245,158,11,0.25);
    }
    .lb-rank {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      min-width: 32px;
      text-align: center;
      color: var(--muted);
      flex-shrink: 0;
    }
    .lb-rank.top { color: var(--text); font-size: 20px; }
    .lb-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .lb-me .lb-avatar { background: #f59e0b; color: #1c1a17; }
    .lb-name-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .lb-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lb-loja {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lb-you-tag {
      font-size: 9px;
      font-weight: 800;
      background: #f59e0b;
      color: #1c1a17;
      padding: 2px 6px;
      border-radius: 20px;
      margin-left: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
      vertical-align: middle;
    }
    .lb-points {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      color: var(--red);
      text-align: right;
      flex-shrink: 0;
    }
    .lb-points span {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      margin-left: 2px;
    }

    /* ── Separador quando usuário está fora do top 10 ── */
    .lb-gap {
      text-align: center;
      color: var(--muted);
      font-size: 18px;
      letter-spacing: 4px;
      padding: 4px 0;
    }

    /* ── Skeleton rows ── */
    .lb-row-skeleton {
      height: 62px;
      border-radius: var(--radius-md);
    }

    /* ── Estado vazio ── */
    .lb-empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
    }
    .lb-empty-icon { font-size: 44px; margin-bottom: 10px; }
    .lb-empty h3 {
      font-family: var(--font-display);
      font-size: 15px;
      color: var(--text);
      margin-bottom: 6px;
    }
    .lb-empty p { font-size: 13px; line-height: 1.5; }

    @media (max-width: 400px) {
      .stat-grid { grid-template-columns: repeat(3, 1fr); }
      .stat-card-num { font-size: 20px; }
    }
  </style>
</head>

<body data-page="leaderboard">

  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-logo" href="../index.html">M</a>
      <div class="navbar-brand">
        <h1>Ranking</h1>
        <p>Os melhores estudantes</p>
      </div>
      <a href="../index.html" class="navbar-back" aria-label="Voltar para o início">← Início</a>
    </div>
  </nav>

  <div class="lb-page">

    <!-- ── Seu desempenho ── -->
    <div>
      <div class="section-label">Seu desempenho</div>
      <div class="stat-grid" aria-live="polite">
        <div class="stat-card">
          <div class="stat-card-num yellow skeleton" id="myRank" aria-label="Sua posição no ranking">—</div>
          <div class="stat-card-label">Sua posição</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-num skeleton" id="myPoints" aria-label="Questões corretas">—</div>
          <div class="stat-card-label">Questões corretas</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-num green skeleton" id="myXp" aria-label="Quizzes feitos">—</div>
          <div class="stat-card-label">Quizzes feitos</div>
        </div>
      </div>
    </div>

    <!-- ── Top 10 ── -->
    <div>
      <div class="section-label">Top 10 — Melhores estudantes</div>
      <div class="lb-list" id="lbList">
        <div class="lb-row-skeleton skeleton"></div>
        <div class="lb-row-skeleton skeleton"></div>
        <div class="lb-row-skeleton skeleton"></div>
        <div class="lb-row-skeleton skeleton"></div>
        <div class="lb-row-skeleton skeleton"></div>
      </div>
    </div>

  </div>

  <footer class="site-footer">
    <strong>MC Guias</strong> · Ranking Global · Desenvolvido por Adrian E. Silva
  </footer>

  <script type="module">
    import { getOnlineLeaderboard, getOnlineUserRank, getUserRank, getTopPlayers } from '../js/supabase/leaderboard.js';

    function el(id) { return document.getElementById(id); }

    function timeout(ms) {
      return new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms));
    }

    function localStats() {
      try {
        const history = JSON.parse(localStorage.getItem('mc_quiz_history') || '[]');
        const pontos  = history.reduce((s, r) => s + (r.correct || 0), 0);
        return { rank: null, pontos, quizzes: history.length };
      } catch { return null; }
    }

    function renderMyStats(rank) {
      ['myRank', 'myPoints', 'myXp'].forEach(id => el(id).classList.remove('skeleton'));
      if (!rank) {
        el('myRank').textContent   = '—';
        el('myPoints').textContent = '—';
        el('myXp').textContent     = '—';
        return;
      }
      el('myRank').textContent   = rank.rank ? '#' + rank.rank : '—';
      el('myPoints').textContent = rank.pontos ?? '—';
      el('myXp').textContent     = rank.quizzes ?? '—';
    }

    function avatarText(p) {
      // Usa sigla pessoal se disponível, senão inicial do username
      return (p.sigla || p.username || '?').charAt(0).toUpperCase();
    }

    function rowHTML(pos, p, isMe) {
      const medal  = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : null;
      const rankEl = medal
        ? `<div class="lb-rank top">${medal}</div>`
        : `<div class="lb-rank">#${pos}</div>`;
      const youTag  = isMe ? '<span class="lb-you-tag">Você</span>' : '';
      const lojaTag = p.loja ? `<div class="lb-loja">${p.loja}</div>` : '';
      return `<div class="lb-row${isMe ? ' lb-me' : ''}">
        ${rankEl}
        <div class="lb-avatar">${avatarText(p)}</div>
        <div class="lb-name-wrap">
          <div class="lb-name"><a href="perfil-publico.html?u=${encodeURIComponent(p.username || '')}" style="color:inherit;text-decoration:none;" onclick="event.stopPropagation()">${p.username || 'Jogador'}</a>${youTag}</div>
          ${lojaTag}
        </div>
        <div class="lb-points">${p.pontos}<span>pts</span></div>
      </div>`;
    }

    function renderList(players, rank) {
      const list = el('lbList');

      if (!players || players.length === 0) {
        list.innerHTML = `<div class="lb-empty">
          <div class="lb-empty-icon">🏁</div>
          <h3>Nenhum jogador ainda</h3>
          <p>Complete simulados para aparecer<br>no ranking global!</p>
        </div>`;
        return;
      }

      // players vem do Supabase com: { user_id, username, loja, sigla, pontos, quizzes }
      const top10 = players.slice(0, 10);

      // Identifica o usuário atual pela posição no rank (rank.pontos == p.pontos e rank.quizzes == p.quizzes)
      // Como não temos user_id exposto, usamos pontos+quizzes como chave de identidade
      function isCurrentUser(p) {
        return rank && p.pontos === rank.pontos && p.quizzes === rank.quizzes;
      }

      let html = top10.map((p, i) => rowHTML(i + 1, p, isCurrentUser(p))).join('');

      if (rank && rank.rank > 10) {
        html += `<div class="lb-gap">···</div>`;
        html += rowHTML(rank.rank, { username: '—', loja: '', sigla: '', pontos: rank.pontos, quizzes: rank.quizzes }, true);
      }

      list.innerHTML = html;
    }

    async function init() {
      // tentativa 1: RPCs online
      try {
        const [rank, players] = await Promise.race([
          Promise.all([getOnlineUserRank(), getOnlineLeaderboard(20)]),
          timeout(8000)
        ]);
        renderMyStats(rank);
        renderList(players, rank);
        return;
      } catch (e) {
        console.warn('Leaderboard RPC falhou, tentando consulta direta:', e.message);
      }

      // tentativa 2: consulta direta à tabela (sem RPC)
      try {
        const [rank, players] = await Promise.race([
          Promise.all([getUserRank(), getTopPlayers(20)]),
          timeout(6000)
        ]);
        const adaptedRank = rank ? { rank: rank.rank, pontos: rank.points, quizzes: rank.total_xp } : null;
        const adaptedPlayers = (players || []).map(p => ({ ...p, pontos: p.points, quizzes: p.total_xp }));
        renderMyStats(adaptedRank);
        renderList(adaptedPlayers, adaptedRank);
        return;
      } catch (e) {
        console.warn('Consulta direta falhou:', e.message);
      }

      // fallback local: mostra stats do localStorage
      renderMyStats(localStats());
      el('lbList').innerHTML = `<div class="lb-empty">
        <div class="lb-empty-icon">📡</div>
        <h3>Ranking online indisponível</h3>
        <p>Não foi possível conectar ao servidor.<br>Continue estudando — seu progresso é salvo localmente!</p>
      </div>`;
    }

    init();
  </script>

</body>
</html>
