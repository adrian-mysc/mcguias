<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.style.visibility="hidden"</script>
  <script type="module" src="../js/auth-guard.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking — MC Guias</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#DA291C">
  <meta name="description" content="Ranking dos estudantes do MC Guias. Veja a classificação por pontos, quizzes concluídos e vitórias nas batalhas, e acompanhe sua posição entre os melhores.">
  <meta property="og:title" content="Ranking — MC Guias">
  <meta property="og:description" content="Ranking dos estudantes do MC Guias. Veja a classificação por pontos, quizzes concluídos e vitórias nas batalhas.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/theme.js"></script>
  <style>
    .lb-page {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 14px 90px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Stat cards (mesmo padrão do dashboard) ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-card-num {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 900;
      color: var(--red);
      line-height: 1;
    }
    .stat-card-num.yellow { color: #f59e0b; }
    .stat-card-num.green  { color: #22c55e; }
    .stat-card-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      margin-top: 2px;
    }

    /* ── Lista do ranking ── */
    .lb-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      transition: box-shadow .15s;
    }
    .lb-row.lb-me {
      border-color: #f59e0b;
      background: linear-gradient(135deg, rgba(245,158,11,0.06) 0%, transparent 100%);
      box-shadow: 0 0 0 2px rgba(245,158,11,0.25);
    }
    .lb-rank {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      min-width: 32px;
      text-align: center;
      color: var(--muted);
      flex-shrink: 0;
    }
    .lb-rank.top { color: var(--text); font-size: 20px; }
    .lb-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .lb-me .lb-avatar { background: #f59e0b; color: #1c1a17; }
    .lb-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
    .lb-name-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .lb-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lb-loja {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .lb-you-tag {
      font-size: 9px;
      font-weight: 800;
      background: #f59e0b;
      color: #1c1a17;
      padding: 2px 6px;
      border-radius: 20px;
      margin-left: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
      vertical-align: middle;
    }
    .lb-points {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      color: var(--red);
      text-align: right;
      flex-shrink: 0;
    }
    .lb-points span {
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      margin-left: 2px;
    }

    /* ── Separador quando usuário está fora do top 10 ── */
    .lb-gap {
      text-align: center;
      color: var(--muted);
      font-size: 18px;
      letter-spacing: 4px;
      padding: 4px 0;
    }

    /* ── Skeleton rows ── */
    .lb-row-skeleton {
      height: 62px;
      border-radius: var(--radius-md);
    }

    /* ── Estado vazio ── */
    .lb-empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
    }
    .lb-empty-icon { font-size: 44px; margin-bottom: 10px; }
    .lb-empty h3 {
      font-family: var(--font-display);
      font-size: 15px;
      color: var(--text);
      margin-bottom: 6px;
    }
    .lb-empty p { font-size: 13px; line-height: 1.5; }

    /* ── Barra de controle da lista ── */
    .lb-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .lb-refresh-btn {
      font-size: 12px;
      font-weight: 700;
      color: var(--red);
      background: none;
      border: 1.5px solid var(--red);
      border-radius: 20px;
      padding: 4px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
      font-family: var(--font-body);
    }
    .lb-refresh-btn:hover { background: rgba(218,41,28,0.08); }
    .lb-refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lb-last-updated {
      font-size: 10.5px;
      color: var(--muted);
      font-weight: 500;
    }
    /* ── Filtros ── */
    .lb-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .lb-filter-bar select,
    .lb-filter-bar input[type="text"] {
      flex: 1;
      min-width: 110px;
      padding: 7px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 12.5px;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }
    .lb-filter-bar select:focus,
    .lb-filter-bar input[type="text"]:focus {
      border-color: var(--red);
    }
    .lb-filter-active-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--red);
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(218,41,28,0.08);
      align-self: center;
    }
    /* ── CTA sem ranking ── */
    .lb-no-rank-cta {
      background: rgba(245,158,11,0.07);
      border: 1.5px dashed rgba(245,158,11,0.4);
      border-radius: var(--radius-md);
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      font-weight: 600;
      color: #92400e;
    }
    [data-theme="dark"] .lb-no-rank-cta { color: #fbbf24; border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.06); }

    /* ── Tabs ── */
    .lb-tabs {
      display: flex; gap: 6px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 4px;
    }
    .lb-tab {
      flex: 1; padding: 9px 12px; border-radius: calc(var(--radius-md) - 2px);
      border: none; background: none; font-size: 13px; font-weight: 700;
      color: var(--muted); cursor: pointer; transition: background .15s, color .15s;
      font-family: var(--font-body);
    }
    .lb-tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.12); }

    /* ── Battle rank row extras ── */
    .lb-win-badge {
      font-size: 11px; font-weight: 700;
      background: rgba(34,197,94,.12); color: #15803d;
      border-radius: 20px; padding: 2px 8px;
      white-space: nowrap;
    }
    [data-theme="dark"] .lb-win-badge { background: rgba(34,197,94,.18); color: #4ade80; }
    .lb-points.wins { color: #22c55e; }

    @media (max-width: 400px) {
      .stat-grid { grid-template-columns: repeat(3, 1fr); }
      .stat-card-num { font-size: 20px; }
    }
  </style>
</head>

  <script type="module">
    import { getOnlineLeaderboard, getOnlineUserRank, getUserRank, getTopPlayers, getAvatarsByUserIds } from '../js/supabase/leaderboard.js';
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    function el(id) { return document.getElementById(id); }

    function timeout(ms) {
      return new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms));
    }

    function localStats() {
      try {
        const history = JSON.parse(localStorage.getItem('mc_quiz_history') || '[]');
        const pontos  = history.reduce((s, r) => s + (r.score || 0), 0);
        return { rank: null, pontos, quizzes: history.length };
      } catch { return null; }
    }

    function renderMyStats(rank) {
      ['myRank', 'myPoints', 'myXp'].forEach(id => el(id).classList.remove('skeleton'));
      if (!rank) {
        el('myRank').textContent   = '—';
        el('myPoints').textContent = '—';
        el('myXp').textContent     = '—';
        return;
      }
      el('myRank').textContent   = rank.rank ? '#' + rank.rank : '—';
      el('myPoints').textContent = rank.pontos ?? '—';
      el('myXp').textContent     = rank.quizzes ?? '—';
    }

    function avatarText(p) {
      // Usa sigla pessoal se disponível, senão inicial do username
      return (p.sigla || p.username || '?').charAt(0).toUpperCase();
    }

    let allPlayers = [];
    let currentRank = null;

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function safeUrl(u){u=String(u||'');return /^https?:\/\//i.test(u)?u:'';}

    function applyFilters() {
      const estado      = document.getElementById('filterEstado')?.value      || '';
      const restaurante = (document.getElementById('filterRestaurante')?.value || '').trim().toUpperCase();
      const sort        = document.getElementById('filterSort')?.value         || 'pontos';

      let filtered = allPlayers.filter(p => {
        if (estado && p.estado !== estado) return false;
        if (restaurante && !(p.loja || '').toUpperCase().includes(restaurante)) return false;
        return true;
      });

      if (sort === 'taxa') {
        filtered = [...filtered].sort((a, b) => {
          const ta = a.quizzes > 0 ? a.pontos / a.quizzes : 0;
          const tb = b.quizzes > 0 ? b.pontos / b.quizzes : 0;
          return tb - ta;
        });
      } else if (sort === 'quizzes') {
        filtered = [...filtered].sort((a, b) => (b.quizzes || 0) - (a.quizzes || 0));
      }

      const list = el('lbList');
      if (filtered.length === 0) {
        list.innerHTML = `<div class="lb-empty">
          <div class="lb-empty-icon">🔍</div>
          <h3>Nenhum resultado</h3>
          <p>Nenhum jogador encontrado para os filtros selecionados.</p>
        </div>`;
        return;
      }

      function isCurrentUser(p) {
        if (!currentRank) return false;
        if (currentRank.username && p.username) return p.username === currentRank.username;
        if (currentRank.pontos == null || currentRank.quizzes == null) return false;
        return p.pontos === currentRank.pontos && p.quizzes === currentRank.quizzes && currentRank.pontos > 0;
      }

      list.innerHTML = filtered.slice(0, 20).map((p, i) => rowHTML(i + 1, p, isCurrentUser(p))).join('');
    }
    window.applyFilters = applyFilters;

    function rowHTML(pos, p, isMe) {
      const medal  = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : null;
      const rankEl = medal
        ? `<div class="lb-rank top">${medal}</div>`
        : `<div class="lb-rank">#${pos}</div>`;
      const youTag  = isMe ? '<span class="lb-you-tag">Você</span>' : '';
      const lojaTag = p.loja ? `<div class="lb-loja">${esc(p.loja)}</div>` : '';
      const displayName = esc(p.display_name || p.username || 'Jogador');
      const avatarUrl = safeUrl(p.avatar);
      const avatarInner = avatarUrl
        ? `<img src="${esc(avatarUrl)}" alt="${displayName}" loading="lazy">`
        : avatarText(p);
      return `<div class="lb-row${isMe ? ' lb-me' : ''}">
        ${rankEl}
        <div class="lb-avatar">${avatarInner}</div>
        <div class="lb-name-wrap">
          <div class="lb-name"><a href="perfil-publico.html?u=${encodeURIComponent(p.username || '')}" style="color:inherit;text-decoration:none;" onclick="event.stopPropagation()">${displayName}</a>${youTag}</div>
          ${lojaTag}
        </div>
        <div class="lb-points">${p.pontos}<span>pts</span></div>
      </div>`;
    }

    async function enrichWithProfiles(players) {
      const uids = players.map(p => p.user_id).filter(Boolean);
      if (!uids.length) return players;
      try {
        const SURL = 'https://iizzeeceqysdfhnkosrc.supabase.co';
        const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpenplZWNlcXlzZGZobmtvc3JjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MTM4MDYsImV4cCI6MjA5NDI4OTgwNn0.tdoZWMwPoWz6uxmj1-6QNrYU8tt1u7mF8cGUY0DHHho';
        const res = await fetch(
          `${SURL}/rest/v1/profiles?id=in.(${uids.join(',')})&select=id,estado,cidade,display_name`,
          { headers: { apikey: SKEY, Authorization: `Bearer ${SKEY}` } }
        );
        const rows = res.ok ? await res.json() : [];
        const map = Object.fromEntries(rows.map(r => [r.id, r]));
        return players.map(p => ({ ...p, estado: map[p.user_id]?.estado || null, cidade: map[p.user_id]?.cidade || null, display_name: p.display_name || map[p.user_id]?.display_name || null }));
      } catch { return players; }
    }

    async function renderList(players, rank) {
      const list = el('lbList');

      if (!players || players.length === 0) {
        list.innerHTML = `<div class="lb-empty">
          <div class="lb-empty-icon">🏁</div>
          <h3>Nenhum jogador ainda</h3>
          <p>Complete simulados para aparecer<br>no ranking global!</p>
        </div>`;
        return;
      }

      currentRank = rank;

      // Enriquece com estado/cidade dos perfis em background
      const enriched = await enrichWithProfiles(players);
      allPlayers = enriched;

      applyFilters();

      if (rank && rank.rank > 10) {
        const myRow = rowHTML(rank.rank, { username: rank.username || '—', display_name: rank.display_name || null, loja: '', sigla: '', pontos: rank.pontos, quizzes: rank.quizzes, avatar: rank.avatar }, true);
        list.innerHTML += `<div class="lb-gap">···</div>${myRow}`;
      }
    }

    async function init() {
      // tentativa 1: RPCs online
      try {
        const [rawRank, rawPlayers] = await Promise.race([
          Promise.all([getOnlineUserRank(), getOnlineLeaderboard(20)]),
          timeout(8000)
        ]);
        // Normalise field names regardless of whether the RPC uses pontos/quizzes or points/total_xp
        const rank = rawRank ? {
          rank:     rawRank.rank     ?? rawRank.posicao,
          pontos:   rawRank.pontos   ?? rawRank.points,
          quizzes:  rawRank.quizzes  ?? rawRank.total_xp,
          username: rawRank.username ?? rawRank.user,
          display_name: rawRank.display_name ?? null,
          avatar:   rawRank.avatar   ?? null,
        } : null;
        // RPC já inclui avatar; fallback: busca por user_id caso algum player não tenha
        let players = rawPlayers || [];
        const ids0 = players.filter(p => p.user_id && !p.avatar).map(p => p.user_id);
        if (ids0.length) {
          const avatarMap0 = await getAvatarsByUserIds(ids0).catch(() => ({}));
          players = players.map(p => ({ ...p, avatar: avatarMap0[p.user_id] || null }));
        }
        renderMyStats(rank);
        await renderList(players, rank);
        return;
      } catch (e) {
        console.warn('Leaderboard RPC falhou, tentando consulta direta:', e.message);
      }

      // tentativa 2: consulta direta à tabela (sem RPC)
      try {
        const [rank, players] = await Promise.race([
          Promise.all([getUserRank(), getTopPlayers(20)]),
          timeout(6000)
        ]);
        const adaptedRank = rank ? { rank: rank.rank, pontos: rank.points, quizzes: rank.total_xp, username: rank.username, avatar: rank.avatar ?? null } : null;
        let adaptedPlayers = (players || []).map(p => ({ ...p, pontos: p.points, quizzes: p.total_xp }));
        // Enriquece com avatares
        const ids = adaptedPlayers.map(p => p.user_id).filter(Boolean);
        const avatarMap = ids.length ? await getAvatarsByUserIds(ids).catch(() => ({})) : {};
        adaptedPlayers = adaptedPlayers.map(p => ({ ...p, avatar: avatarMap[p.user_id] || null }));
        renderMyStats(adaptedRank);
        await renderList(adaptedPlayers, adaptedRank);
        return;
      } catch (e) {
        console.warn('Consulta direta falhou:', e.message);
      }

      // fallback local: mostra stats do localStorage
      renderMyStats(localStats());
      el('lbList').innerHTML = `<div class="lb-empty">
        <div class="lb-empty-icon">📡</div>
        <h3>Ranking online indisponível</h3>
        <p>Não foi possível conectar ao servidor.<br>Continue estudando — seu progresso é salvo localmente!</p>
      </div>`;
    }

    function setLastUpdated() {
      const lu = el('lastUpdated');
      if (lu) lu.textContent = `Atualizado às ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
    }

    async function refresh() {
      const btn = el('refreshBtn');
      if (btn) btn.classList.add('spinning');
      // Reset skeletons
      ['myRank','myPoints','myXp'].forEach(id => {
        const e = el(id); if (e) { e.classList.add('skeleton'); e.textContent = '—'; }
      });
      allPlayers = [];
      el('lbList').innerHTML = Array(5).fill('<div class="lb-row-skeleton skeleton"></div>').join('');
      await init();
      setLastUpdated();
      if (btn) btn.classList.remove('spinning');
    }
    window.refresh = refresh;

    init().then(() => {
      setLastUpdated();
      // Show CTA if user hasn't appeared in the ranking yet
      const rankTxt = el('myRank')?.textContent;
      if (!rankTxt || rankTxt === '—') {
        const local = localStats();
        if (!local || local.pontos === 0) {
          const cta = document.createElement('div');
          cta.className = 'lb-no-rank-cta';
          cta.innerHTML = '🎯 <span>Complete um simulado para entrar no ranking global!</span>';
          el('lbList').after(cta);
        }
      }
    });

    // ── Tab switcher ───────────────────────────────────
    let battleLoaded = false;
    window.switchTab = function(tab) {
      el('panelStudy').style.display  = tab === 'study'  ? '' : 'none';
      el('panelBattle').style.display = tab === 'battle' ? '' : 'none';
      el('tabStudy').classList.toggle('active',  tab === 'study');
      el('tabBattle').classList.toggle('active', tab === 'battle');
      if (tab === 'battle' && !battleLoaded) {
        loadBattleRanking();
        battleLoaded = true;
      }
    };

    // ── Battle ranking ─────────────────────────────────
    const SURL = 'https://iizzeeceqysdfhnkosrc.supabase.co';
    const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpenplZWNlcXlzZGZobmtvc3JjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MTM4MDYsImV4cCI6MjA5NDI4OTgwNn0.tdoZWMwPoWz6uxmj1-6QNrYU8tt1u7mF8cGUY0DHHho';
    const sb = createClient(SURL, SKEY, { auth: { persistSession: true, autoRefreshToken: true } });

    let currentUserId = null;
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      currentUserId = session?.user?.id || null;
    })();

    function battleRowHTML(pos, p, isMe) {
      const medal  = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : null;
      const rankEl = medal ? `<div class="lb-rank top">${medal}</div>` : `<div class="lb-rank">#${pos}</div>`;
      const youTag = isMe ? '<span class="lb-you-tag">Você</span>' : '';
      const rate   = p.total_battles > 0 ? Math.round(p.wins * 100 / p.total_battles) : 0;
      const name   = esc(p.display_name || p.username || 'Jogador');
      const avatarUrl = safeUrl(p.avatar);
      const avatarInner = avatarUrl
        ? `<img src="${esc(avatarUrl)}" alt="${name}" loading="lazy">`
        : (p.display_name || p.username || '?').charAt(0).toUpperCase();
      return `<div class="lb-row${isMe ? ' lb-me' : ''}">
        ${rankEl}
        <div class="lb-avatar">${avatarInner}</div>
        <div class="lb-name-wrap">
          <div class="lb-name"><a href="perfil-publico.html?u=${encodeURIComponent(p.username || '')}" style="color:inherit;text-decoration:none;">${name}</a>${youTag}</div>
          <div class="lb-loja">${p.total_battles} batalha${p.total_battles !== 1 ? 's' : ''} · ${p.losses} derrota${p.losses !== 1 ? 's' : ''}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0">
          <div class="lb-points wins">${p.wins}<span>vitórias</span></div>
          <div class="lb-win-badge">${rate}% win</div>
        </div>
      </div>`;
    }

    async function loadBattleRanking() {
      const list = el('battleList');

      // My stats
      if (currentUserId) {
        const { data: my } = await sb.from('battle_stats')
          .select('wins, losses, draws, total_battles')
          .eq('user_id', currentUserId).maybeSingle();
        ['myBWins','myBLosses','myBRate'].forEach(id => el(id).classList.remove('skeleton'));
        if (my) {
          el('myBWins').textContent    = my.wins;
          el('myBLosses').textContent  = my.losses;
          const rate = my.total_battles > 0 ? Math.round(my.wins * 100 / my.total_battles) : 0;
          el('myBRate').textContent    = rate + '%';
        } else {
          el('myBWins').textContent = el('myBLosses').textContent = '0';
          el('myBRate').textContent = '—';
        }
      }

      // Top list
      let { data: players, error } = await sb.from('battle_stats')
        .select('user_id, username, avatar, wins, losses, draws, total_battles')
        .gt('total_battles', 0)
        .order('wins', { ascending: false })
        .order('total_battles', { ascending: false })
        .limit(20);

      if (error || !players || players.length === 0) {
        list.innerHTML = `<div class="lb-empty">
          <div class="lb-empty-icon">⚔️</div>
          <h3>Nenhuma batalha ainda</h3>
          <p>Dispute duelos na página de Batalha<br>para aparecer aqui!</p>
        </div>`;
        return;
      }

      // Enriquece com avatares frescos do profiles (battle_stats.avatar pode estar desatualizado)
      try {
        const uids = players.map(p => p.user_id).filter(Boolean);
        const { data: pRows } = await sb.from('profiles').select('id, avatar, display_name').in('id', uids);
        const avMap = Object.fromEntries((pRows || []).map(r => [r.id, r]));
        players = players.map(p => ({ ...p, avatar: avMap[p.user_id]?.avatar ?? p.avatar ?? null, display_name: p.display_name || avMap[p.user_id]?.display_name || null }));
      } catch (_) {}

      list.innerHTML = players.map((p, i) =>
        battleRowHTML(i + 1, p, p.user_id === currentUserId)
      ).join('');

      const lu = el('lastUpdatedBattle');
      if (lu) lu.textContent = `Atualizado às ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
    }

    window.refreshBattle = async function() {
      const btn = el('refreshBattleBtn');
      if (btn) btn.classList.add('spinning');
      el('battleList').innerHTML = Array(3).fill('<div class="lb-row-skeleton skeleton"></div>').join('');
      ['myBWins','myBLosses','myBRate'].forEach(id => {
        const e = el(id); if (e) { e.classList.add('skeleton'); e.textContent = '—'; }
      });
      await loadBattleRanking();
      if (btn) btn.classList.remove('spinning');
    };
  </script>

</body>
</html>
